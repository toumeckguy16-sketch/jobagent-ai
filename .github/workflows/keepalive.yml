name: Streamlit Keepalive

on:
  schedule:
    # Toutes les 6 heures (syntaxe cron : minute heure jour mois jour-semaine)
    - cron: "0 */6 * * *"
  workflow_dispatch: {}  # permet aussi de le lancer manuellement depuis l'onglet Actions

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run keepalive script
        run: python keepalive.py
